# .github/workflows/ci-dev.yaml과 같은 흐름을 GitLab CI/CD로 옮긴 것.
# 차이점은 이미지 저장소가 GHCR이 아니라 GitLab Container Registry라는 것,
# 그리고 이 파이프라인은 로컬 GitLab 인스턴스 + 자체 호스팅 GitLab Runner에서만 돈다는 것이다.
# (GitLab Runner는 태생부터 "자체 호스팅"이 기본값이다 — GitHub Actions와 달리
#  "호스팅형 러너를 쓸지 말지" 자체를 고민할 필요가 없다.)
#
# GITLAB_HOST를 하드코딩하는 이유: GitLab의 $CI_REGISTRY/$CI_SERVER_HOST는
# external_url(=localhost:8929, 이 컴퓨터의 브라우저·git push용)에서 뽑혀 나오는데,
# CI job은 별도 컨테이너 안에서 도니까 그 안의 "localhost"는 자기 자신을 가리켜서
# GitLab에 닿지 못한다. 컨테이너에서 호스트를 가리키는 이름은 host.docker.internal이다.
stages:
  - test
  - build
  - scan
  - deploy-dev

variables:
  GITLAB_HOST: "host.docker.internal:8929"
  REGISTRY_HOST: "host.docker.internal:5050"
  IMAGE_NAME: "host.docker.internal:5050/root/devops-study"

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd apps/hello-service
    - mvn -B test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build-and-push:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      # 로컬 레지스트리가 HTTP(TLS 없음)라서 dind 데몬에 insecure로 등록해야 docker
      # login/push가 "http: server gave HTTP response to HTTPS client"로 막히지 않는다.
      command: ["--insecure-registry=host.docker.internal:5050"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$REGISTRY_HOST"
    - export IMAGE_TAG="sha-$(echo $CI_COMMIT_SHA | cut -c1-12)"
    - echo "IMAGE_TAG=$IMAGE_TAG" > build.env
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:dev-latest" apps/hello-service
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:dev-latest"
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-and-push
  script:
    # CI 시점 exit-code는 0으로 둔다 (데모 파이프라인이 base 이미지 취약점 때문에
    # 매번 실패하지 않도록). 실무에서는 1로 바꾼다.
    - trivy image --exit-code 0 --severity CRITICAL,HIGH "$IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

update-dev-values:
  stage: deploy-dev
  image: alpine:3
  needs:
    - build-and-push
    - scan
  before_script:
    - apk add --no-cache git yq
  script:
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@local"
    - git remote set-url origin "http://gitlab-ci-token:${CI_JOB_TOKEN}@${GITLAB_HOST}/${CI_PROJECT_PATH}.git"
    - yq eval -i ".image.tag = \"$IMAGE_TAG\"" gitops/values/dev-gitlab/hello-service.yaml
    - yq eval -i ".image.repository = \"$IMAGE_NAME\"" gitops/values/dev-gitlab/hello-service.yaml
    - git add gitops/values/dev-gitlab/hello-service.yaml
    - 'git commit -m "dev(gitlab): deploy hello-service $IMAGE_TAG" || echo "no changes"'
    - git push origin HEAD:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
