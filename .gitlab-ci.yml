# .github/workflows/ci-dev.yaml과 같은 흐름을 GitLab CI/CD로 옮긴 것.
# 차이점은 이미지 저장소가 GHCR이 아니라 GitLab Container Registry라는 것,
# 그리고 이 파이프라인은 로컬 GitLab 인스턴스 + 자체 호스팅 GitLab Runner에서만 돈다는 것이다.
# (GitLab Runner는 태생부터 "자체 호스팅"이 기본값이다 — GitHub Actions와 달리
#  "호스팅형 러너를 쓸지 말지" 자체를 고민할 필요가 없다.)
#
# GITLAB_HOST를 하드코딩하는 이유: GitLab의 $CI_REGISTRY/$CI_SERVER_HOST는
# external_url(=localhost:8929, 이 컴퓨터의 브라우저·git push용)에서 뽑혀 나오는데,
# CI job은 별도 컨테이너 안에서 도니까 그 안의 "localhost"는 자기 자신을 가리켜서
# GitLab에 닿지 못한다. 컨테이너에서 호스트를 가리키는 이름은 host.docker.internal이다.
stages:
  - test
  - build
  - scan
  - deploy-dev

variables:
  GITLAB_HOST: "host.docker.internal:8929"
  REGISTRY_HOST: "host.docker.internal:5050"
  IMAGE_NAME: "host.docker.internal:5050/root/devops-study"

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd apps/hello-service
    - mvn -B test
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build-and-push:
  stage: build
  # docker:dind는 host 네트워크 모드 러너에서 insecure-registry 설정이 제대로 안 먹었다
  # (여러 번 확인함). Kaniko는 데몬이 따로 없어서 그 문제 자체가 없고, --insecure/
  # --skip-tls-verify 플래그로 끝난다. 정확히 M-ADP의 실제 Jenkins가 Harbor를
  # --insecure --skip-tls-verify로 쓰던 것과 같은 이유·같은 해법이다.
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - export IMAGE_TAG="sha-$(echo $CI_COMMIT_SHA | cut -c1-12)"
    - echo "IMAGE_TAG=$IMAGE_TAG" > build.env
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$REGISTRY_HOST\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/apps/hello-service"
        --dockerfile "${CI_PROJECT_DIR}/apps/hello-service/Dockerfile"
        --destination "$IMAGE_NAME:$IMAGE_TAG"
        --destination "$IMAGE_NAME:dev-latest"
        --insecure
        --skip-tls-verify
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-and-push
  script:
    # CI 시점 exit-code는 0으로 둔다 (데모 파이프라인이 base 이미지 취약점 때문에
    # 매번 실패하지 않도록). 실무에서는 1로 바꾼다.
    # 이 로컬 환경이 느려서(Java DB 다운로드 등) 기본 5분 타임아웃에 걸리므로 늘려 둔다.
    - trivy image --insecure --timeout 15m --exit-code 0 --severity CRITICAL,HIGH "$IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

update-dev-values:
  stage: deploy-dev
  image: alpine:3
  needs:
    - build-and-push
    - scan
  before_script:
    - apk add --no-cache git yq
  script:
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@local"
    # CI_JOB_TOKEN은 기본적으로 이 저장소에 push 권한이 없다("You are not allowed to
    # push code to this project"). GITLAB_PUSH_TOKEN은 write_repository 권한을 가진
    # 개인 액세스 토큰으로, CI/CD 변수(Settings > CI/CD > Variables)에 등록해 둔 것이다.
    - git remote set-url origin "http://root:${GITLAB_PUSH_TOKEN}@${GITLAB_HOST}/${CI_PROJECT_PATH}.git"
    - yq eval -i ".image.tag = \"$IMAGE_TAG\"" gitops/values/dev-gitlab/hello-service.yaml
    - yq eval -i ".image.repository = \"$IMAGE_NAME\"" gitops/values/dev-gitlab/hello-service.yaml
    - git add gitops/values/dev-gitlab/hello-service.yaml
    - 'git commit -m "dev(gitlab): deploy hello-service $IMAGE_TAG" || echo "no changes"'
    # -o ci.skip: 이 push가 새 파이프라인을 만들지 않게 한다. 없으면 이 커밋이 다시
    # 파이프라인을 돌리고, 그게 또 커밋하는 무한 루프가 생긴다(실제로 10→11→12로 확인).
    # GitHub Actions는 GITHUB_TOKEN으로 한 push가 워크플로를 다시 트리거하지 않아서
    # 이 문제가 없었다 — 플랫폼마다 "봇 커밋"을 다루는 기본값이 다르다.
    - git push -o ci.skip origin HEAD:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
