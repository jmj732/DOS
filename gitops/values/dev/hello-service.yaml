# CI(ci-dev.yaml)가 배포 때마다 image.tag만 자동으로 고쳐 쓴다.
# 이 파일이 "지금 dev에 무엇이 떠 있는가"에 대한 유일한 진실이다.
image:
  repository: ghcr.io/jmj732/hello-service
  tag: dev-latest

replicaCount: 1

env:
  - name: APP_ENV
    value: "dev"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
