name: Secret scan

# apps/hello-service 뿐 아니라 저장소 전체(gitops/values, workflow 파일 등)를 매 push·PR마다 본다.
# M-ADP 실제 사례에서 DB 비밀번호가 apps/values/dev/auth.yaml에 평문으로 들어간 적이 있었다.
# 이 워크플로는 그런 커밋이 main에 닿기 전에(그리고 promote PR 단계에서도) 잡아내려는 것이다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리를 봐야 과거 커밋에 남은 시크릿도 잡는다

      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 기본 종료 코드 처리를 그대로 둔다: 시크릿이 발견되면 이 job은 실패하고
          # (unlike Trivy 스캔) 파이프라인을 실제로 막는다. 오탐이 적고 결과가 명확하기 때문이다.
