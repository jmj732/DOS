apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  description: dev 환경 애플리케이션 전용 프로젝트. hello-dev 네임스페이스만 건드릴 수 있다.
  sourceRepos:
    - https://github.com/jmj732/DevOps_study.git
  destinations:
    - namespace: hello-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
