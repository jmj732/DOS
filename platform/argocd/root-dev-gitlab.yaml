apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev-gitlab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://host.docker.internal:8929/root/devops-study.git
    targetRevision: main
    path: gitops/apps
    helm:
      valueFiles:
        - values-dev-gitlab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
