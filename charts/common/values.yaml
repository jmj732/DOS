replicaCount: 1

image:
  repository: ghcr.io/jmj732/hello-service
  tag: "dev-latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
serviceAccountName: ""

containerPort: 8080

service:
  port: 80

env: []

podAnnotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# JVM은 기동이 느리고, 노드가 바쁘면 더 느려진다(실측 45초). startupProbe가 성공할
# 때까지 liveness/readiness는 검사를 시작하지 않으므로, 느린 기동 중에 liveness가
# 컨테이너를 죽이는 재시작 루프를 막는다. 최대 5초 x 30회 = 150초까지 기다린다.
startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
