replicaCount: 1

image:
  repository: ghcr.io/jmj732/hello-service
  tag: "dev-latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
serviceAccountName: ""

containerPort: 8080

service:
  port: 80

env: []

podAnnotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
